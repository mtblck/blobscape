name: Check

# On every pull request: the unit tests and the build, which give the same answer on any
# machine. Every night on main, and by hand (Actions, Check, Run workflow): every browser
# check as well. A night that fails opens one issue, later failed nights add a line to it,
# and the first green night closes it.
#
# The browser checks are not run on pull requests: a full run takes about half an hour on
# these runners, so sessions run `npm run check` (only the checks a change reaches)
# themselves. See docs/testing.md.
#
# verify-shots/ (the reports and the screenshots) is kept with the run for a week.
on:
  pull_request:
  schedule:
    # 3:17 AM in New York in winter, 4:17 in summer
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      checks:
        description: Browser checks to run, by name or group (empty for every one)
        type: string
        default: ''

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:deps
      - run: npm test
      - run: npm run build
      - name: Chromium
        if: github.event_name != 'pull_request'
        run: |
          # The Chromium the cloud sessions have (Playwright 1.63.0's): the full browser, not the headless shell.
          npx --yes playwright@1.63.0 install --with-deps chromium
          echo "CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -path '*/chromium-*' -name chrome -type f | head -1)" >> "$GITHUB_ENV"
      - name: Every browser check
        if: github.event_name != 'pull_request'
        env:
          CHECKS: ${{ inputs.checks }}
          # GitHub's runners are shared and their speed swings: two checks at a time, and three times the wait.
          VERIFY_SLOW: 3
        # Word splitting is wanted: several names, or none.
        run: npm run verify -- --jobs=2 $CHECKS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-shots
          path: verify-shots/
          retention-days: 7
          if-no-files-found: ignore


  report:
    name: Nightly result
    needs: check
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly browser checks are failing
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$n" ]; then gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Green again: $RUN"; fi
          elif [ -z "$n" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The nightly run of every check on main failed: $RUN

          The end of its log names each failure, and its verify-shots artifact has the reports and screenshots. To run one check again: \`npm run verify -- <name>\`. This issue closes itself on the first green night."
          else
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN"
          fi
