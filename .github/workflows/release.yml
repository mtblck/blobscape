name: Release

# Cuts a release when a merge to main changes `version` in package.json (the release PR,
# made with `npm run release -- x.y.z`): it runs the unit tests, tags that merge commit
# vX.Y.Z with this run's own token, makes the GitHub release from that version's
# CHANGELOG section, then publishes @blobscape/engine (packages/engine, same version) to
# npm unless its manifest is still `private` or that version is already there. Merging
# the release PR is the approval. The site deploys from main on Vercel as always. A tag
# pushed by hand (vX.Y.Z matching package.json) also makes its release. Same shape as
# seedkin's release.yml.
#
# npm: trusted publishing (this workflow's OIDC token, with provenance) once the package
# exists on npm; npmjs.com -> @blobscape/engine -> Settings -> Trusted publishers names
# GitHub Actions, mtblck/blobscape and this file, release.yml, so keep its name. npm only
# offers that for a package that exists, so the first version goes out with a short-lived
# granular token in the NPM_TOKEN secret; delete the secret once trusted publishing is on.
# A failed publish leaves the tag and release in place: re-running the job finishes it.
on:
  push:
    tags: ['v*']
    branches: [main]
    # Ignored for tag pushes, which always run.
    paths: [package.json]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # To create the tag and the GitHub release.
      contents: write
      # The OIDC token npm trusted publishing exchanges for a one-time publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or newer).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # On main, release only when this push changed the version: a merge that touches
      # package.json for anything else (a dependency) does nothing.
      - name: Version to release
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # A version being released needs its CHANGELOG section (the release notes).
          needs_notes() {
            if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
              echo "::error::package.json is $version but CHANGELOG.md has no '## [$version] - date' section."
              exit 1
            fi
          }
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then echo "::error::Tag $REF_NAME doesn't match package.json version $version."; exit 1; fi
            needs_notes
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before=""
          if git fetch --depth=1 --no-tags origin "$BEFORE" 2>/dev/null; then
            before=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          fi
          if [ "$before" = "$version" ]; then
            echo "::notice::package.json changed but its version is still $version; nothing to release."
            exit 0
          fi
          # Already tagged: a re-run finishing this release if the tag is on this commit, otherwise nothing to do.
          tagged=$(git ls-remote --tags origin "refs/tags/v$version" | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::notice::v$version is already tagged on another commit; nothing to release."
            exit 0
          fi
          needs_notes
          [ -n "$tagged" ] && echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
      # A red unit test stops the release before anything is tagged.
      - if: steps.version.outputs.release == 'true'
        run: npm ci --ignore-scripts && npm test
      - name: Tag the release commit
        if: steps.version.outputs.release == 'true' && steps.version.outputs.tagged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
      - name: GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # This version's CHANGELOG section: from its heading to the next one.
          awk -v v="${TAG#v}" '/^## \[/ { on = index($0, "## [" v "]") == 1; next } /^\[.*\]: / { exit } on' CHANGELOG.md > notes.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Blobscape $TAG" --notes-file notes.md --verify-tag
      - name: Engine package to publish?
        if: steps.version.outputs.release == 'true'
        id: engine
        working-directory: packages/engine
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = true ]; then
            echo "::notice::@blobscape/engine is still private; nothing goes to npm."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if [ "$version" != "${TAG#v}" ]; then echo "::error::$name is $version but the release is $TAG."; exit 1; fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.version.outputs.tag }}
      # The unit tests above include the package's own (no Spark or site code, the README's
      # and the lessons' code typecheck against it); the build here is what ships.
      - if: steps.engine.outputs.publish == 'true'
        run: npm run engine:build
      - name: Publish @blobscape/engine
        if: steps.engine.outputs.publish == 'true'
        working-directory: packages/engine
        env:
          # Only for the first version; empty once trusted publishing takes over.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
